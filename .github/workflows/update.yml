name: 每日更新行情数据

# GitHub Actions 的 cron 固定按 UTC 解释。北京时间 = UTC + 8。
# GitHub 免费调度会延迟、偶尔丢弃触发，所以每个交易日设 5 个时点互为兜底：
#   UTC 07:05 = 北京 15:05 收盘速报（指数、涨停池、题材、梯队、个股）
#   UTC 07:45 = 北京 15:45 补一次
#   UTC 08:30 = 北京 16:30
#   UTC 09:40 = 北京 17:40 补全交易所龙虎榜
#   UTC 10:30 = 北京 18:30 兜底
# 数据无变化时提交会被跳过，重复运行只消耗几分钟 runner，不产生空提交。
on:
  schedule:
    # 收盘后密集重试：UTC 07:00–11:40 = 北京 15:00–19:40，每 20 分钟一次（每个交易日 15 次）。
    # GitHub 免费调度会延迟甚至丢弃触发（本仓库 11-26 五个时点全部未触发），
    # 靠多次命中提高成功率；脚本自身有收盘门禁，未收盘会剔除当日不完整数据。
    - cron: '*/20 7-11 * * 1-5'
  workflow_dispatch:
  # 改动 app/（例如 app/codes.js 码表、页面）时自动重新发布，不重跑抓数
  push:
    branches: [main]
    paths:
      - 'app/**'

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install --quiet requests

      - name: 更新 30 天历史
        if: github.event_name != 'push'
        run: python scripts/fetch_history.py

      - name: 抓取并构建数据
        if: github.event_name != 'push'
        run: python scripts/market_update.py

      - name: 提交数据到 main
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data.js app/data.json data/raw
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: 更新至 $(python -c "import json;print(json.load(open('app/data.json',encoding='utf-8'))['dataDate'])")"
            git push || (git pull --rebase --quiet && git push)
          fi

      - name: 发布站点到 gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd app
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
name: 每日更新行情数据

# 北京时间 15:10（UTC 07:10）收盘速报：指数、涨停池、题材、梯队、个股明细。
# 北京时间 17:40（UTC 09:40）再跑一次：补全交易所公布的龙虎榜，覆盖前一次结果。
# GitHub Actions 的 cron 固定按 UTC 解释。
on:
  schedule:
    - cron: '10 7 * * 1-5'
    - cron: '40 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install --quiet requests

      - name: 抓取并构建数据
        run: python scripts/market_update.py

      - name: 提交数据到 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data.js app/data.json data/raw
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: 更新至 $(python -c "import json;print(json.load(open('app/data.json',encoding='utf-8'))['dataDate'])")"
            git push || (git pull --rebase --quiet && git push)
          fi

      - name: 发布站点到 gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd app
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
name: 每日更新行情数据

# 北京时间 15:10（UTC 07:10）；GitHub Actions 的 cron 固定按 UTC 计时。
on:
  schedule:
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install --quiet requests

      - name: 抓取并构建数据
        run: python scripts/market_update.py

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/data.js app/data.json data/raw
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: 更新至 $(python -c "import json;print(json.load(open('app/data.json',encoding='utf-8'))['dataDate'])")"
            git push
          fi

      - name: 发布到 gh-pages
        run: |
          cd app
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
